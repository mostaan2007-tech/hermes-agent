{% extends "base.html" %}
{% block title %}تغییر گذرواژه{% endblock %}

{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-4 text-xl font-bold">تغییر گذرواژه</h1>

  {% if user.must_change_password %}
    <div class="alert alert-warning mb-4 py-2 text-xs">
      برای ادامه کار باید گذرواژه خود را تغییر دهید.
    </div>
  {% endif %}

  <form method="post" action="/profile/password" class="panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="panel-body space-y-3">
      <label class="field">
        <span class="field-label">گذرواژه فعلی</span>
        <input type="password" name="current_password" class="input input-bordered input-sm w-full" required>
        {% if errors.current_password %}<span class="field-error">{{ errors.current_password }}</span>{% endif %}
      </label>
      <label class="field">
        <span class="field-label">گذرواژه جدید</span>
        <input type="password" name="new_password" class="input input-bordered input-sm w-full" required>
        {% if errors.new_password %}<span class="field-error">{{ errors.new_password }}</span>{% endif %}
        <span class="field-hint">حداقل ۸ نویسه، ترکیبی از حرف و رقم.</span>
      </label>
      <label class="field">
        <span class="field-label">تکرار گذرواژه جدید</span>
        <input type="password" name="confirm_password" class="input input-bordered input-sm w-full" required>
        {% if errors.confirm_password %}<span class="field-error">{{ errors.confirm_password }}</span>{% endif %}
      </label>
    </div>
    <div class="flex justify-end gap-2 border-t border-base-300 px-4 py-3">
      <a class="btn btn-ghost btn-sm" href="/profile">انصراف</a>
      <button class="btn btn-primary btn-sm">تغییر گذرواژه</button>
    </div>
  </form>
</div>
{% endblock %}
