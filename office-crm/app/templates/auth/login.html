<!doctype html>
<html lang="fa" dir="rtl" data-theme="office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود — {{ company or settings.app_short_name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="grid min-h-screen place-items-center bg-base-200 px-4">

<div class="w-full max-w-sm">
  <div class="mb-6 text-center">
    <div class="mx-auto grid size-14 place-items-center rounded-2xl bg-primary text-2xl text-primary-content">📋</div>
    <h1 class="mt-3 text-lg font-bold">{{ company or settings.app_name }}</h1>
    <p class="mt-1 text-xs text-base-content/60">CRM و اتوماسیون اداری، در یک سامانه</p>
  </div>

  <form method="post" action="/login" class="panel">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="panel-body space-y-3">
      {% if banner %}
        <div class="alert alert-info py-2 text-xs">{{ banner }}</div>
      {% endif %}
      {% if error %}
        <div class="alert alert-error py-2 text-xs">{{ error }}</div>
      {% endif %}

      <label class="field">
        <span class="field-label">نام کاربری</span>
        <input name="username" class="input input-bordered w-full" value="{{ username or '' }}"
               autocomplete="username" autofocus required>
      </label>
      <label class="field">
        <span class="field-label">گذرواژه</span>
        <input type="password" name="password" class="input input-bordered w-full"
               autocomplete="current-password" required>
      </label>
      <label class="flex items-center gap-2 text-xs">
        <input type="checkbox" name="remember" value="1" class="checkbox checkbox-xs checkbox-primary">
        مرا برای ۳۰ روز به خاطر بسپار
      </label>
      <button class="btn btn-primary w-full" type="submit">ورود به سامانه</button>
    </div>
  </form>

  <p class="mt-4 text-center text-[11px] leading-5 text-base-content/50">
    در صورت فراموشی گذرواژه با مدیر سامانه تماس بگیرید.<br>
    نشست‌ها روی سرور ثبت می‌شود و همه فعالیت‌ها قابل پیگیری است.
  </p>
</div>

</body>
</html>
