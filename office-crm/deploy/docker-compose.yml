# docker compose -f deploy/docker-compose.yml up -d
#
#   app      — the program itself (SQLite + uploads in the office-data volume)
#   caddy    — HTTPS for the LAN, so colleagues can use https://office.local
#   litestream (profile "backup") — streams the SQLite file to another disk/B2/S3
#
# First run creates the database and the admin user; read the app logs for the
# generated admin password (or set OFFICE_ADMIN_PASSWORD in office-crm.env).

name: office-crm

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ./office-crm.env
    environment:
      OFFICE_DATA_DIR: /data
    volumes:
      - office-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # replace with the name colleagues will open
      OFFICE_SITE_ADDRESS: office.local

  # Continuous replication of the live SQLite database (optional, but cheap).
  litestream:
    image: litestream/litestream:0.3
    profiles: ["backup"]
    restart: unless-stopped
    command: replicate -config /etc/litestream.yml
    volumes:
      - office-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
      - ./backups:/backup

volumes:
  office-data:
  caddy-data:
  caddy-config:
